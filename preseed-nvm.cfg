# Locale settings
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

# Network configuration
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string foshozee
d-i netcfg/get_hostname seen true
d-i netcfg/get_domain string localdomain
d-i netcfg/get_domain seen true

# Optional: fully unattended static fallback. Uncomment ALL of these to make
# the installer silently fall back to this static config when DHCP fails
# (works on networks with and without DHCP). The late_command below will
# automatically carry the static address into the initramfs for dropbear.
#d-i netcfg/dhcp_failed note
#d-i netcfg/dhcp_options select Configure network manually
#d-i netcfg/get_ipaddress string 192.0.2.10
#d-i netcfg/get_netmask string 255.255.255.0
#d-i netcfg/get_gateway string 192.0.2.1
#d-i netcfg/get_nameservers string 192.0.2.1
#d-i netcfg/confirm_static boolean true

# Auto-load missing firmware instead of prompting
d-i hw-detect/load_firmware boolean true

# Set the root password
d-i passwd/root-password password changeme1234
d-i passwd/root-password-again password changeme1234
d-i passwd/make-user boolean false

# Clock and time zone setup
d-i clock-setup/utc boolean true
d-i time/zone string Etc/UTC

# Disk partitioning - Dynamic detection (Strictly Non-USB)
d-i partman/early_command string \
    TARGET=""; \
    for d in /dev/nvme0n1 /dev/vda /dev/sda /dev/sdb $(list-devices disk); do \
        if [ -b "$d" ] && ! readlink -f /sys/block/$(basename $d) | grep -q usb; then \
            TARGET="$d"; \
            break; \
        fi; \
    done; \
    debconf-set partman-auto/disk "$TARGET"; \
    debconf-set grub-installer/bootdev "$TARGET"

# --- Full-disk encryption: LUKS with LVM inside ---
# Layout: unencrypted /boot (+ ESP on UEFI) + one LUKS container holding
# an LVM volume group with root and swap.
d-i partman-auto/method string crypto

# Throwaway install-time passphrase. Rotate it after first boot:
# find the crypto_LUKS partition with 'lsblk -f', then run
# 'cryptsetup luksChangeKey /dev/<that-partition>'.
d-i partman-crypto/passphrase password changeme1234
d-i partman-crypto/passphrase-again password changeme1234

# Skip the pre-encryption wipe of the disk with random data.
# The wipe can take hours on large disks; comment this out if you
# want it (it hides how much encrypted data exists on the disk).
d-i partman-auto-crypto/erase_disks boolean false

# Uncomment only if you deliberately use a short/weak passphrase,
# otherwise the installer will stop and complain:
#d-i partman-crypto/weak_passphrase boolean true

# The crypto method uses LVM inside the LUKS container, so the LVM
# prompts must be pre-answered as well
d-i partman-auto-lvm/guided_size string max
# Deterministic VG name matching the final hostname (otherwise d-i derives
# it from the install-time hostname, e.g. foshozee-vg)
d-i partman-auto-lvm/new_vg_name string demo-vg
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-md/device_remove_md boolean true

d-i partman-auto/choose_recipe select atomic
# Official question name per the trixie example-preseed; the legacy
# partman/ variant below is kept as a harmless extra.
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# ---------------------------------------------------------------------------
# LUKS CHEAT SHEET for the installed system (comments only, installer
# ignores this block).
#
# Identify the encrypted partition and its mapping:
#   lsblk -f            # the partition typed 'crypto_LUKS' is the one
#   cat /etc/crypttab   # mapping name d-i created (e.g. nvme0n1p3_crypt)
#
# Unlock at boot:
#   - console: type the passphrase at the prompt
#   - remote:  ssh root@<host>     # dropbear listens during early boot
#              cryptroot-unlock    # run at the initramfs shell, enter passphrase
#     (dropbear has its own host key, so give it a separate Host alias or
#      known_hosts file in ~/.ssh/config to avoid mismatch warnings)
#
# Change the passphrase (asks old, then new; no initramfs rebuild needed):
#   cryptsetup luksChangeKey /dev/<luks-partition>
#
# Add / remove an extra passphrase, inspect key slots:
#   cryptsetup luksAddKey /dev/<luks-partition>
#   cryptsetup luksRemoveKey /dev/<luks-partition>
#   cryptsetup luksDump /dev/<luks-partition>
#
# Back up the LUKS header and store it OFF this machine (if the on-disk
# header is ever damaged, data is unrecoverable without this file):
#   cryptsetup luksHeaderBackup /dev/<luks-partition> --header-backup-file /root/demo-luks-header.img
#
# Manual unlock from a rescue/live system (remember LVM lives inside LUKS):
#   cryptsetup open /dev/<luks-partition> rescue
#   vgchange -ay demo-vg
#   mount /dev/demo-vg/root /mnt
# ...and to close back up:
#   umount /mnt; vgchange -an demo-vg; cryptsetup close rescue
# ---------------------------------------------------------------------------

# APT configuration - Specify a mirror
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# Package selection
tasksel tasksel/first multiselect standard
d-i pkgsel/include string openssh-server sudo curl dropbear-initramfs
# Don't stall on the popularity-contest question
popularity-contest popularity-contest/participate boolean false

# Bootloader installation
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i finish-install/reboot_in_progress note

# Late command: root SSH key, key-only SSH for ALL users
# (PasswordAuthentication and KbdInteractiveAuthentication off,
# PermitRootLogin prohibit-password, pinned via drop-in), hostname,
# dropbear-initramfs remote unlock. Ends by validating sshd config
# syntax AND asserting all three effective values (sshd -T may print
# prohibit-password as its alias without-password). If any check fails,
# the install errors out loudly instead of shipping a box that accepts
# passwords over SSH.
# If the installer was given a static IP (netcfg/get_ipaddress non-empty,
# whether preseeded or entered by hand after DHCP failed), the same
# address is baked into the kernel cmdline as ip=... so the initramfs
# network matches the installed system. Otherwise the initramfs defaults
# to DHCP.
d-i preseed/late_command string \
    in-target mkdir -p /root/.ssh; \
    in-target sh -c 'echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIE4O0HGv2fFqMaYQONZ18Tw/0+KKbMt9tafXMrfSbk9k" > /root/.ssh/authorized_keys'; \
    in-target chmod 600 /root/.ssh/authorized_keys; \
    in-target chmod 700 /root/.ssh; \
    mkdir -p /target/etc/ssh/sshd_config.d; \
    printf 'PermitRootLogin prohibit-password\nPasswordAuthentication no\nKbdInteractiveAuthentication no\n' > /target/etc/ssh/sshd_config.d/10-keys-only.conf; \
    echo "demo" > /target/etc/hostname; \
    sed -i -e '/^127\.0\.1\.1/d' -e '/foshozee/d' /target/etc/hosts; \
    echo "127.0.1.1 demo.localdomain demo" >> /target/etc/hosts; \
    mkdir -p /target/etc/dropbear/initramfs; \
    echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIE4O0HGv2fFqMaYQONZ18Tw/0+KKbMt9tafXMrfSbk9k" > /target/etc/dropbear/initramfs/authorized_keys; \
    chmod 600 /target/etc/dropbear/initramfs/authorized_keys; \
    IPADDR="$(debconf-get netcfg/get_ipaddress)"; \
    if [ -n "$IPADDR" ]; then \
        GW="$(debconf-get netcfg/get_gateway)"; \
        NM="$(debconf-get netcfg/get_netmask)"; \
        IFACE="$(sed -n 's/^iface \([^ ]*\) inet static.*/\1/p' /target/etc/network/interfaces | head -n 1)"; \
        sed -i "s#^GRUB_CMDLINE_LINUX=\"#&ip=${IPADDR}::${GW}:${NM}:demo:${IFACE}:off #" /target/etc/default/grub; \
        in-target update-grub; \
    fi; \
    in-target update-initramfs -u; \
    in-target mkdir -p /run/sshd; \
    in-target /usr/sbin/sshd -t; \
    in-target sh -c 'C="$(/usr/sbin/sshd -T)"; echo "$C" | grep -Eiq "^permitrootlogin (prohibit-password|without-password)$" && echo "$C" | grep -iq "^passwordauthentication no$" && echo "$C" | grep -iq "^kbdinteractiveauthentication no$"'

# Debugging (optional, uncomment if needed)
# d-i debconf/priority string low
# d-i debconf/debug string 5
